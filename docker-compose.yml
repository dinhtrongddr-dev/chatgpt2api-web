services:
  chatgpt2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api-web:latest
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - CHATGPT2API_AUTH_KEY=${CHATGPT2API_AUTH_KEY:-}
      - CHATGPT2API_BASE_URL=${CHATGPT2API_BASE_URL:-}
      - CHATGPT2API_THREAD_TOKENS=${CHATGPT2API_THREAD_TOKENS:-120}
      - CHATGPT2API_HOST=0.0.0.0
      - CHATGPT2API_PORT=3000
      - DATABASE_URL=${DATABASE_URL:-}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
